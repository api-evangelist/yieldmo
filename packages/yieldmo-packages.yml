decay_finding: >-
  The gap between the API and the SDKs that wrap it is the story here. Yieldmo shipped a live,
  OAuth-protected MCP + REST reporting API (discovered 2026-08-12) with zero client libraries, while
  its two registry-published first-party SDKs — Android ym:ymsdk 4.1.3 and iOS YieldmoSDK 4.2.5 —
  have not seen a release since 2017.

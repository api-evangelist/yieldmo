summary:
  official_count: 4
  registries: [github-maven, cocoapods, npm, cdn]
  headline_finding: >-
    Yieldmo publishes no client library for the MCP / DCS reporting API discovered this round, and no
    package at all on npm, PyPI, RubyGems, crates.io or Maven Central. Every first-party SDK it does
    ship is either abandoned (last release 2017) or distributed outside a registry. The living code
    is the Prebid.js bid adapter, which Yieldmo authors but Prebid publishes.


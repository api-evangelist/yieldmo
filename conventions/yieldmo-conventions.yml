source: >-
  Derived from openapi/yieldmo-dcs-mcp-openapi.json (27 paths / 19 business operations) and live
  response headers observed on https://api.yieldmo.com on 2026-08-12. Yieldmo publishes no developer
  documentation for this API, so nothing here is quoted from a docs page — every convention below was
  read out of the machine-readable contract or off the wire.

api:
  name: Yieldmo DCS reporting API (behind the MCP server)
  base_url: https://api.yieldmo.com/dcs/mcp
  spec: openapi/yieldmo-dcs-mcp-openapi.json
  style: REST, read-only
  transport_note: >-
    servers[] in the spec is the relative path "/dcs/mcp" with no host, so a client cannot resolve a
    base URL from the spec alone. The host must be supplied out of band (api.yieldmo.com).

authentication:
  style: OAuth 2.0 Bearer token (Amazon Cognito)
  header: 'Authorization: Bearer <token>'
  declared_in_spec: false
  detail: authentication/yieldmo-authentication.yml
  scopes: scopes/yieldmo-scopes.yml
  note: >-
    The OpenAPI declares no securitySchemes and no security requirement on any operation. The auth
    contract is discoverable only from /.well-known/ and from the 401 challenge.

idempotency:
  supported: false
  applicable: false
  reason: >-
    All 19 business operations are GET and read-only, so they are idempotent by HTTP method. There is
    no Idempotency-Key header, no request-id echo, and no write surface that would need one. No
    Idempotency pointer is emitted in apis.yml — asserting one here would be false.

pagination:
  style: limit-only truncation
  cursor: false
  offset: false
  total_count: false
  parameters:
    - {name: limit, applies_to: [campaign_performance, campaign_creative_performance], default: 5000}
    - {name: limit, applies_to: [campaign_biddable_object_url_performance], default: 1000}
    - {name: limit, applies_to: [top_urls_by_campaign], default: 100}
    - {name: num_entries, applies_to: [top_bottom_urls], default: 50}
    - {name: min_impressions, applies_to: [top_urls_by_campaign], default: 0, kind: filter}
    - {name: min_imps, applies_to: [top_bottom_urls], default: 0, kind: filter}
  gap: >-
    There is no way to fetch page 2. A caller who hits the limit has a silently truncated result set
    and no signal that truncation occurred. The same concept is also named inconsistently across
    operations (limit vs num_entries, min_impressions vs min_imps).

date_filtering:
  primary_style: integer date keys in YYYYMMDD form
  parameters:
    - {name: start_date_key, type: integer, default: 19000101}
    - {name: end_date_key, type: 'integer | null', default: null, note: null means open-ended / today}
  secondary_style: ISO date strings
  secondary_parameters:
    - {name: start_time, type: string, format: YYYY-MM-DD, default: '1900-01-01', applies_to: [advertiser_data]}
    - {name: end_time, type: 'string | null', format: YYYY-MM-DD, applies_to: [advertiser_data], note: exclusive; defaults to today}
  gap: >-
    Two incompatible date encodings coexist in one API — 17 operations take integer YYYYMMDD keys,
    advertiser_data takes YYYY-MM-DD strings. The sentinel default 19000101 means an unparameterised
    call requests all history.


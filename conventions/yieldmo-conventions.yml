rate_limits:
  documented: false
  headers_observed: []
  detail: rate-limits/yieldmo-rate-limits.yml
  note: No X-RateLimit-*, RateLimit-* or Retry-After header was present on any observed response, and no 429 is declared in the spec.

content_negotiation:
  request: query parameters only; no request bodies on any business operation
  response: application/json
  compression: not advertised

conventions_gaps:
  - No operation carries a tag, so the spec cannot be grouped or split by resource.
  - operationIds are FastAPI auto-generated (function name + path + method), e.g. campaign_performance_canned_reports_campaign_performance_get — long, path-coupled, and unstable if a route is renamed.
  - No securitySchemes declared despite the API being fully authenticated.
  - No response schemas — every 200 is an untyped object, so an agent cannot know the shape of a report before calling it.
  - No examples anywhere in the spec.

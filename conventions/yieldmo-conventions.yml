request_tracing:
  request_id_header: null
  observed_response_header: apigw-requestid
  note: >-
    AWS API Gateway emits apigw-requestid on every response. It is not documented, not echoed from a
    client-supplied header, and not referenced in any error body — usable for a support ticket, not
    for client-side correlation.

versioning:
  scheme: none
  current: 'info.version 0.1.0 (FastAPI default; not a published API version)'
  in_path: false
  in_header: false
  note: >-
    There is no version segment in the path, no version header, and no dated version train. The only

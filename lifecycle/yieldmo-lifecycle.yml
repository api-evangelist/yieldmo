changelog:
  url: null
  finding: >-
    No dated changelog exists for any Yieldmo API surface. The only versioned history that IS public
    is third-party: Prebid.js releases carry the yieldmoBidAdapter, and the yieldmo/maven-repository
    GitHub repo carries 13 dated ymsdk Android releases (last 4.1.3). See packages/yieldmo-packages.yml.

surface_maturity:
  - surface: MCP server + DCS reporting API (api.yieldmo.com/dcs/mcp)
    state: live-undocumented
    note: >-
      Live, OAuth-protected, machine-readable — and mentioned nowhere on Yieldmo's public surface.
      No announcement, no docs page, no llms.txt. Discovered this round only by probing an
      unadvertised host.
  - surface: Prebid.js bid adapter (biddercode yieldmo)
    state: actively-maintained
    note: Shipped in Prebid.js; last Prebid.js release 11.29.0 on 2026-08-06. Both Prebid.js and Prebid Server adapters.
  - surface: Yieldmo Synthetic Inventory Module
    state: maintained
    note: Published Prebid.js module.
  - surface: Yieldmo JavaScript SDK
    state: stale-but-in-use
    note: >-
      The documenting repo github.com/yieldmo/yieldmo-js-sdk was last pushed 2018-09-04; the wiki is
      still the only published reference for window._ym.requestPageView. The SDK itself is served
      from ads.yieldmo.com and is unversioned from a consumer's point of view.
  - surface: Yieldmo Android SDK (ym:ymsdk)
    state: abandoned
    note: Last artifact ymsdk-4.1.3 in yieldmo/maven-repository; repo last pushed 2017-06-08.
  - surface: Yieldmo iOS SDK (CocoaPods YieldmoSDK)
    state: abandoned
    note: Last version 4.2.5 published 2017-10-05; the Specs repo is archived.


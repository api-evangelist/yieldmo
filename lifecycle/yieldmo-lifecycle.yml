source: >-
  Live probes of Yieldmo hosts on 2026-08-12 plus openapi/yieldmo-dcs-mcp-openapi.json. Yieldmo
  publishes no versioning policy, deprecation policy, SLA or changelog on any readable surface;
  everything below is a recorded absence backed by the probes in x-evidence.


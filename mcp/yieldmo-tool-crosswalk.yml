purpose: >-
  Bind each agent-facing tool to the REST operation that backs it so the tool inherits a REAL
  inputSchema — the operation's parameters block — instead of a guessed one. Yieldmo is an unusual
  case: the MCP server and the REST API are the SAME FastAPI application, so the two surfaces are
  1:1 rather than the usual overlapping-but-divergent projections.


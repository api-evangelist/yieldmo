server:
  name: yieldmo-dcs
  transport: http                       # streamable HTTP (JSON-RPC over POST)
  url: https://api.yieldmo.com/dcs/mcp
  runtime: uvicorn / FastAPI (server header "uvicorn"; OpenAPI info.title "FastAPI")
  openapi: openapi/yieldmo-dcs-mcp-openapi.json

auth:
  gated: true
  methods: [oauth2]
  challenge: >-
    WWW-Authenticate: Bearer error="invalid_token",
    error_description="Authentication required",
    resource_metadata="https://api.yieldmo.com/.well-known/oauth-protected-resource/dcs/mcp"
  oauth2:
    issuer: https://api.yieldmo.com/dcs/mcp
    authorization_endpoint: https://yieldmo-cuba.auth.us-east-1.amazoncognito.com/oauth2/authorize
    token_endpoint: https://yieldmo-cuba.auth.us-east-1.amazoncognito.com/oauth2/token
    registration_endpoint: https://api.yieldmo.com/dcs/mcp/register
    revocation_endpoint: https://yieldmo-cuba.auth.us-east-1.amazoncognito.com/oauth2/revoke
    jwks_uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vZfEMm5aZ/.well-known/jwks.json
    identity_provider: Amazon Cognito (user pool us-east-1_vZfEMm5aZ, domain yieldmo-cuba)
    scopes_supported: [openid, profile, email]
    dynamic_client_registration: true   # RFC 7591; the spec labels the handler "Fake Registration Mcp"
    discovery:
      - well-known/yieldmo-oauth-protected-resource.json
      - well-known/yieldmo-oauth-authorization-server.json
      - well-known/yieldmo-openid-configuration.json


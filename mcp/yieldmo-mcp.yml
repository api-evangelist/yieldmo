discovery: >-
  Found by probing api.yieldmo.com (an AWS API Gateway host that is not referenced anywhere in
  Yieldmo's public marketing or documentation). /.well-known/oauth-protected-resource returns an
  RFC 9728 protected-resource document naming https://api.yieldmo.com/dcs/mcp as the resource.
  The server answers MCP JSON-RPC on that path and co-serves its own OpenAPI 3.1.0 at
